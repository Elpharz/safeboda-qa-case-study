[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    positive: valid input / happy path; the documented success response is expected
    negative: invalid input, wrong auth or forbidden access; a documented error is expected
    boundary: values at or just past a documented limit (min/max, lengths, windows, balance == fare)
    state: depends on trip or wallet state, or on the order of calls (transitions, replays, single-use)
    slow: takes minutes (e.g. waits for the 5 minute estimate expiry); needs RUN_SLOW=1
    concurrency: race-condition checks
    inferred: expectation inferred from the spec's intent, not stated word for word (see docstring)
    spec_gap: spec is silent, test documents the invariant we think must hold
